# 坤面板 WAF(http 级指令)
lua_shared_dict kunwaf_cc 64m;
lua_shared_dict kunwaf_ban 32m;
lua_shared_dict kunwaf_viol 32m;

# 慢速攻击防护(Slowloris/Slow Read):限制读写间隔
client_body_timeout 15s;
client_header_timeout 15s;

# 响应头泄露防护(隐藏 nginx 版本与 PHP 指纹)
server_tokens off;
more_set_headers "Server: KunWAF";
proxy_hide_header X-Powered-By;
